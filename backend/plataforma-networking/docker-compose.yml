name: backend-plataforma-networking

services:
  backend-plataforma-networking:
    image: node:22
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    working_dir: /app
    command: >
      "npm install &&
      npm run dev" 
    env_file: ".env"
    ports:
      - 3000:3000
    depends_on:
      - db-postgres

  db-postgres:
    image: postgres:17
    env_file: ".postgres-container.env"
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initBD:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  db-data: