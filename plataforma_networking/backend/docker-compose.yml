name: backend-plataforma-networking

services:
  backend-plataforma-networking:
    image: node:22
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    working_dir: /app
    command: >
      "npm install &&
      npm run dev" 
    env_file: ".env"
    ports:
      - 3001:3001
    depends_on:
      - db-postgres

  db-postgres:
    image: postgres:17
    env_file: ".postgres-container.env"
    ports:
      - 5432:5432
    volumes:
      - db-data-local:/var/lib/postgresql/data
      - ./initBD:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: email@teste.com
      PGADMIN_DEFAULT_PASSWORD: senha
    depends_on:
      - db-postgres

volumes:
  db-data-local: